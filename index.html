<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title> Smart Calendar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <div class="header">

    <h1> Smart Calendar</h1>

    <p>Designed by Ansh Tripathi</p>

    <div id="clock"></div>

  </div>

  <div class="calendar-header">

    <button onclick="prevMonth()">❮</button>

    <h2 id="monthYear"></h2>

    <button onclick="nextMonth()">❯</button>

  </div>

  <div class="days">
    <div>Sun</div>
    <div>Mon</div>
    <div>Tue</div>
    <div>Wed</div>
    <div>Thu</div>
    <div>Fri</div>
    <div>Sat</div>
  </div>

  <div id="calendar"></div>

</div>

<script src="script.js"></script>

</body>
</html>
